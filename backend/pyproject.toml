[tool.ruff]
# Line length aligned with the existing codebase style
line-length = 100

# Paths to exclude from linting
exclude = [
    "venv",
    ".venv",
    "archive_non_runtime",
    "dev_tools",
    "__pycache__",
    "migrations",
]

[tool.ruff.lint]
# Rule selection:
#   E  = pycodestyle errors
#   F  = Pyflakes (undefined names, unused imports)
#   W  = pycodestyle warnings
#   B  = flake8-bugbear (likely bugs and design issues)
#   I  = isort (import order)
select = ["E", "F", "W", "B", "I"]

# Ignore rules that conflict with existing code style or are too noisy
# for a research codebase with intentional patterns
ignore = [
    "E501",   # Line too long — ruff format handles this; we lint, not format, in CI
    "B008",   # Do not perform function calls in default arguments — Flask patterns use this
    "B904",   # Use raise ... from ... — many existing except blocks omit this
    "F401",   # Module imported but unused — some __init__.py files re-export symbols
    "E701",   # Multiple statements on one line (colon) — compact try/except pattern in scanners
    "E702",   # Multiple statements on one line (semicolon) — compact patterns in database.py
    "B023",   # Function definition does not bind loop variable — intentional in sast_scanner
    "B007",   # Loop control variable not used in loop body — intentional counter patterns
    "B005",   # strip() with multi-char string — existing dns_scanner pattern
    "F541",   # f-string without placeholders — fixed separately, ignored for legacy code
    "B905",   # zip() without strict= — Python <3.10 compat in benchmark tests
    "E402",   # Module level import not at top — conditional imports in database/risk_engine
    "E741",   # Ambiguous variable name — existing l variable in database.py
]

[tool.ruff.lint.per-file-ignores]
# Scripts and seed files can be less strict
"scripts/*.py" = ["W293", "I001"]
"seed_demo_db.py" = ["E", "F", "W", "B"]
"reset_admin.py" = ["E", "F", "W", "B"]
"audit_script.py" = ["E", "F", "W", "B"]
# Test files can have combined imports for brevity
"tests/*.py" = ["E401", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Custom markers
# Usage:
#   pytest -m "not benchmark"   \u2192 skip slow research benchmarks (default in CI)
#   pytest -m benchmark         \u2192 run only benchmark tests (for research validation)
markers = [
    "benchmark: mark test as a research benchmark (slow, produces benchmark_results.json). Run with: pytest -m benchmark",
    "slow: mark test as slow (network-dependent or long-running)",
    "integration: mark test as an integration test requiring a running Flask app",
]

# Default options applied to every pytest run
addopts = [
    "--tb=short",       # concise tracebacks \u2014 full tracebacks are rarely needed in CI
    "-q",               # quiet output in CI; use -v locally for verbose
]

[tool.coverage.run]
source = ["."]
omit = [
    "venv/*",
    ".venv/*",
    "archive_non_runtime/*",
    "dev_tools/*",
    "tests/*",
    "seed_demo_db.py",
    "reset_admin.py",
    "audit_script.py",
    "generate_*.py",
    "create_plan_pdf.py",
    "migrations/*",
]

[tool.coverage.report]
# Lines that are excluded from coverage measurement
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
# Paths to exclude from Bandit security scanning
exclude_dirs = [
    "venv",
    ".venv",
    "tests",
    "archive_non_runtime",
    "dev_tools",
]
# Minimum severity level to report (LOW, MEDIUM, HIGH)
# We set MEDIUM to avoid noise from test utilities and seed scripts
severity = "MEDIUM"
